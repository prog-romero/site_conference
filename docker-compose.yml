services:
  postgres:
    image: postgres:15
    container_name: postgres_conference_site
    restart: always
    environment:
      POSTGRES_DB: conference_bd
      POSTGRES_USER: romero1
      POSTGRES_PASSWORD: romerotchiaze
    ports:
      - "54323:5432"
    networks:
      - conference_network
    volumes:
      # ✅ GARDER le volume persistant (pour la persistence des données)
      - postgres_data:/var/lib/postgresql/data
      # ✅ GARDER le dump (pour l'initialisation quand le volume est vide)
      - ./dump_conference_informatique.sql:/docker-entrypoint-initdb.d/dump_conference_informatique.sql

  conference-labo:
    image: lontsi/conference:latest
    container_name: conference-labo
    restart: unless-stopped
    ports:
      - "8023:8000"
    networks:
      - conference_network
    depends_on:
      - postgres
    stdin_open: true
    tty: true

networks:
  conference_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
