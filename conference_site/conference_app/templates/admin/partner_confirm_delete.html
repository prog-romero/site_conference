{% extends 'conference_app/base.html' %}

{% block title %}Delete Partner - Conference 2025{% endblock %}

{% block content %}
<section class="py-5 bg-primary-dark text-white">
    <div class="container">
        <h1>Delete Partner</h1>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 text-center">
                        <h3 class="mb-4">Are you sure you want to delete "{{ partner.name }}"?</h3>
                        
                        {% if partner.logo %}
                        <div class="mb-4">
                            <img src="{{ partner.logo.url }}" alt="{{ partner.name }} logo" style="max-height: 100px;">
                        </div>
                        {% endif %}
                        
                        <form method="post">
                            {% csrf_token %}
                            <div class="d-flex gap-2 justify-content-center">
                                <button type="submit" class="btn btn-danger">Confirm Delete</button>
                                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
