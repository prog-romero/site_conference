{% extends 'conference_app/base.html' %}

{% block title %}Manage Speaker - Conference 2025{% endblock %}

{% block content %}
<section class="py-5 bg-primary-dark text-white">
    <div class="container">
        <h1>{% if speaker %}Edit{% else %}Add New{% endif %} Speaker</h1>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <form method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="mb-4">
                                <label class="form-label">Name</label>
                                <input type="text" name="name" class="form-control" value="{{ speaker.name|default:'' }}" required>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label">Title</label>
                                <input type="text" name="title" class="form-control" value="{{ speaker.title|default:'' }}" required>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label">Organization</label>
                                <input type="text" name="organization" class="form-control" value="{{ speaker.organization|default:'' }}" required>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label">Bio</label>
                                <textarea name="bio" class="form-control" rows="5" required>{{ speaker.bio|default:'' }}</textarea>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label">Photo</label>
                                {% if speaker.photo %}
                                <div class="mb-2">
                                    <img src="{{ speaker.photo.url }}" alt="{{ speaker.name }}" class="img-thumbnail" style="max-width: 200px;">
                                </div>
                                {% endif %}
                                <input type="file" name="photo" class="form-control" accept="image/*">
                            </div>
                            
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary-custom">Save Speaker</button>
                                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
