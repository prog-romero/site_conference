{% extends 'conference_app/base.html' %}

{% block title %}Manage Agenda Item - Conference 2025{% endblock %}

{% block content %}
<section class="py-5 bg-primary-dark text-white">
    <div class="container">
        <h1>{% if agenda_item %}Edit{% else %}Add New{% endif %} Agenda Item</h1>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-4">
                                <label class="form-label">Title</label>
                                <input type="text" name="title" class="form-control" value="{{ agenda_item.title|default:'' }}" required>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label">Description</label>
                                <textarea name="description" class="form-control" rows="3">{{ agenda_item.description|default:'' }}</textarea>
                            </div>
                            
                            <div class="row mb-4">
                                <div class="col-md-4">
                                    <label class="form-label">Date</label>
                                    <input type="date" name="date" class="form-control" value="{{ agenda_item.date|date:'Y-m-d'|default:'' }}" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Start Time</label>
                                    <input type="time" name="start_time" class="form-control" value="{{ agenda_item.start_time|time:'H:i'|default:'' }}" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">End Time</label>
                                    <input type="time" name="end_time" class="form-control" value="{{ agenda_item.end_time|time:'H:i'|default:'' }}" required>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label">Item Type</label>
                                <select name="item_type" class="form-select" required>
                                    {% for value, label in item_type_choices %}
                                    <option value="{{ value }}" {% if agenda_item.item_type == value %}selected{% endif %}>{{ label }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label">Location</label>
                                <input type="text" name="location" class="form-control" value="{{ agenda_item.location|default:'' }}">
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label">Related Session</label>
                                <select name="session" class="form-select">
                                    <option value="">No Related Session</option>
                                    {% for session in sessions %}
                                    <option value="{{ session.id }}" {% if agenda_item.session_id == session.id %}selected{% endif %}>{{ session.title }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary-custom">Save Agenda Item</button>
                                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
