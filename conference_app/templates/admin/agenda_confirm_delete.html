{% extends 'conference_app/base.html' %}

{% block title %}{{ title }} - Conférence IA Cameroun-France{% endblock %}

{% block content %}
<section class="py-5 bg-primary-dark text-white">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <h1>{{ title }}</h1>
            <a href="{% url 'agenda_list' agenda_item.session.id %}" class="btn btn-outline-light">
                <i class="fas fa-arrow-left me-1"></i> Retour à la liste
            </a>
        </div>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <p>Êtes-vous sûr de vouloir supprimer cet élément d’agenda : <strong>{{ agenda_item.title }}</strong> ?</p>
                        <form method="post">
                            {% csrf_token %}
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-danger">Supprimer</button>
                                <a href="{% url 'agenda_list' agenda_item.session.id %}" class="btn btn-outline-secondary">Annuler</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
