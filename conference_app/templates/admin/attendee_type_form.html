{% extends 'conference_app/base.html' %}

{% block title %}Manage Attendee Type - Conference 2025{% endblock %}

{% block content %}
<section class="py-5 bg-primary-dark text-white">
    <div class="container">
        <h1>{% if attendee_type %}Edit{% else %}Add New{% endif %} Attendee Type</h1>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-4">
                                <label class="form-label">Name</label>
                                <input type="text" name="name" class="form-control" value="{{ attendee_type.name|default:'' }}" required>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label">Description</label>
                                <textarea name="description" class="form-control" rows="4" required>{{ attendee_type.description|default:'' }}</textarea>
                            </div>
                            
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary-custom">Save Attendee Type</button>
                                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
